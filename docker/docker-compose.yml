version: '3.8'

services:
  # ── JARVIS Core Intelligence & API Server ────────────────────────────────
  jarvis-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: jarvis_core
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - API_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://jarvis_user:jarvis_secure_pass@jarvis-postgres:5432/jarvis_db
      - REDIS_URL=redis://jarvis-redis:6379/0
    env_file:
      - ../.env
    depends_on:
      - jarvis-postgres
      - jarvis-redis
    volumes:
      - ../logs:/app/logs

  # ── PostgreSQL Database (Episodic & Knowledge Store) ─────────────────────
  jarvis-postgres:
    image: postgres:16-alpine
    container_name: jarvis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis_user
      POSTGRES_PASSWORD: jarvis_secure_pass
      POSTGRES_DB: jarvis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── Redis Cache & Task Queue ─────────────────────────────────────────────
  jarvis-redis:
    image: redis:7-alpine
    container_name: jarvis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
